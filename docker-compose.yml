services:
  web:
    container_name: speedhive-tools-ui
    # Tagged with the published name so the locally-built image and the
    # one pushed to GHCR are the same reference. build: . stays, so the
    # self-hosted deploy still builds in place rather than pulling.
    image: ghcr.io/cosmoslab58/speedhive-tools-ui:latest
    build: .
    restart: unless-stopped
    environment:
      - SPEEDHIVE_DATA_DIR=/app/data
      # site login password; value lives in the gitignored .env file
      - SPEEDHIVE_UI_PASSWORD=${SPEEDHIVE_UI_PASSWORD}
      # event-count cap applied to every sync (incremental and full); value lives in .env
      - SPEEDHIVE_MAX_ORG_EVENTS=${SPEEDHIVE_MAX_ORG_EVENTS}
    ports:
      - "8854:8854"
    volumes:
      - ./data:/app/data
