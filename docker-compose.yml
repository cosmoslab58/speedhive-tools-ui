services:
  web:
    container_name: speedhive-tools-ui
    # Tagged with the published name so the locally-built image and the
    # one pushed to GHCR are the same reference. build: . stays, so the
    # self-hosted deploy still builds in place rather than pulling.
    image: ghcr.io/cosmoslab58/speedhive-tools-ui:latest
    build: .
    restart: unless-stopped
    labels:
      # The deploy workflow owns this container (compose up on every push).
      # Watchtower must not also recreate it from new GHCR images — a
      # watchtower-recreated container loses its compose project label and
      # the next compose deploy fails with a container-name conflict.
      - com.centurylinklabs.watchtower.enable=false
    environment:
      - SPEEDHIVE_DATA_DIR=/app/data
      # site login password; value lives in the gitignored .env file
      - SPEEDHIVE_UI_PASSWORD=${SPEEDHIVE_UI_PASSWORD}
      # signs the login session cookie; the app refuses to start without it.
      # Value lives in .env (a random 64-hex string)
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:?set FLASK_SECRET_KEY in .env}
      # event-count cap applied to every sync (incremental and full); value lives in .env
      - SPEEDHIVE_MAX_ORG_EVENTS=${SPEEDHIVE_MAX_ORG_EVENTS}
      # shared Anthropic key for AI-assisted record parsing; an org's own key
      # in its settings.json still wins. Optional, value lives in .env
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    ports:
      - "8854:8854"
    volumes:
      - ./data:/app/data
